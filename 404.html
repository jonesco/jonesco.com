  <body>
    <header class="site-header">
      <div class="bar">
        <a class="brand" href="/" aria-label="Wes Jones — home">
          <img src="/images/header2.png" alt="Wes Jones — Lead Product Designer" />
        </a>
        <nav>
          <a href="/#work">Work</a>
          <a href="/#contact">Contact</a>
          <a href="/images/Wes_Jones_Resume.pdf" class="opt">Resumé</a>

      </div>

    <div class="page">

        <h1><strong>Page not found</strong></h1>

        <small>© <span class="yr">2026</span> Wes Jones</small>
      </div>
    </footer>
    <script>
      // Shrink the header once the page is scrolled; hysteresis avoids flicker near the top
      (function () {
        var root = document.documentElement, small = false;
        function update() {
          var y = window.scrollY;
          if (!small && y > 40) { small = true; root.classList.add('is-scrolled'); }
          else if (small && y < 8) { small = false; root.classList.remove('is-scrolled'); }
        }
        update();
        window.addEventListener('scroll', update, { passive: true });
      })();
    </script>
    <script>document.querySelectorAll('.yr').forEach(e => e.textContent = new Date().getFullYear());</script>
  </body>
